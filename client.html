<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡牌游戏 - 前端客户端</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card {
            transition: all 0.2s;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.3);
        }

        .my-turn {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }
    </style>
</head>

<body class="bg-gray-900 text-white min-h-screen">
    <div class="max-w-6xl mx-auto p-6">
        <h1 class="text-4xl font-bold text-center mb-8">🎴 卡牌游戏实时对战（状态已完全同步）</h1>

        <!-- 连接区 -->
        <div id="connectPanel" class="bg-gray-800 p-6 rounded-xl mb-8">
            <div class="flex gap-4 items-end">
                <div class="flex-1">
                    <label class="block text-sm mb-1">你的昵称</label>
                    <input id="playerName" type="text" value="玩家1"
                        class="w-full bg-gray-700 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button onclick="connect()"
                    class="bg-green-600 hover:bg-green-700 px-8 py-3 rounded-lg font-semibold">连接服务器</button>
            </div>
            <div id="status" class="mt-3 text-sm text-gray-400"></div>
        </div>

        <!-- 房间操作区 -->
        <div id="roomPanel" class="hidden bg-gray-800 p-6 rounded-xl mb-8">
            <div class="flex gap-6">
                <button onclick="createRoom()" id="createBtn"
                    class="flex-1 bg-blue-600 hover:bg-blue-700 py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2">🆕
                    创建新房间</button>
                <div class="flex-1 flex gap-3">
                    <input id="roomIdInput" placeholder="粘贴房间号加入"
                        class="flex-1 bg-gray-700 rounded-xl px-4 focus:outline-none focus:ring-2 focus:ring-purple-500">
                    <button onclick="joinRoom()"
                        class="bg-purple-600 hover:bg-purple-700 px-8 rounded-xl font-bold">加入房间</button>
                </div>
            </div>

            <div id="roomInfo" class="mt-6 hidden bg-gray-700 rounded-2xl p-5">
                <div class="flex items-center justify-between">
                    <div>
                        <span class="text-gray-400">当前房间号：</span>
                        <span id="currentRoomId" class="font-mono text-2xl text-green-400 font-bold"></span>
                    </div>
                    <button onclick="copyRoomId()"
                        class="bg-gray-600 hover:bg-gray-500 px-5 py-2 rounded-xl text-sm flex items-center gap-2">📋
                        复制房间号</button>
                </div>
                <p id="roomTip" class="text-sm text-green-400 mt-2"></p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 bg-gray-800 rounded-2xl p-6">
                <div class="flex justify-between items-center mb-6">
                    <div><span class="text-sm text-gray-400">当前回合：</span><span id="currentTurn"
                            class="font-bold text-xl"></span></div>
                    <div><span class="text-sm text-gray-400">上家出的牌：</span><span id="lastCard"
                            class="font-mono text-3xl font-bold text-yellow-400"></span></div>
                </div>
                <div class="mb-4">
                    <div class="text-sm text-gray-400 mb-2">你的手牌（点击出牌）</div>
                    <div id="myHand" class="flex gap-3 flex-wrap"></div>
                </div>
                <div id="gameLog" class="bg-black/50 h-48 overflow-y-auto rounded-xl p-4 text-sm font-mono"></div>
            </div>

            <div class="space-y-6">
                <div class="bg-gray-800 rounded-2xl p-6">
                    <h3 class="font-bold mb-4 flex items-center gap-2">👥 在线玩家 (<span id="playerCount">0</span>)</h3>
                    <div id="playersList" class="space-y-2"></div>
                </div>
                <div class="bg-gray-800 rounded-2xl p-6 flex flex-col h-96">
                    <h3 class="font-bold mb-4">💬 聊天室</h3>
                    <div id="chatMessages" class="flex-1 overflow-y-auto space-y-3 text-sm"></div>
                    <div class="flex gap-2 mt-4">
                        <input id="chatInput" placeholder="输入消息..."
                            class="flex-1 bg-gray-700 rounded-xl px-4 py-3 focus:outline-none"
                            onkeypress="if(event.key==='Enter') sendChat()">
                        <button onclick="sendChat()"
                            class="bg-indigo-600 hover:bg-indigo-700 px-6 rounded-xl">发送</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null, playerID = '', currentRoomID = '', myHandCards = [], isCreating = false;

        function log(msg, color = 'text-gray-300') {
            const div = document.getElementById('gameLog');
            div.innerHTML += `<span class="${color}">[${new Date().toLocaleTimeString()}] ${msg}</span><br>`;
            div.scrollTop = div.scrollHeight;
            console.log('[LOG]', msg); // 调试用
        }

        function addChat(name, content) {
            const div = document.getElementById('chatMessages');
            div.innerHTML += `<div class="flex gap-2"><span class="text-blue-400 font-medium">${name}：</span><span>${content}</span></div>`;
            div.scrollTop = div.scrollHeight;
        }

        function connect() {
            const name = document.getElementById('playerName').value.trim();
            if (!name) return alert('请输入昵称');
            playerID = name;
            ws = new WebSocket(`ws://localhost:8080/ws?player=${encodeURIComponent(name)}`);
            ws.onopen = () => {
                document.getElementById('status').innerHTML = '✅ 已连接（状态同步已修复）';
                document.getElementById('connectPanel').classList.add('hidden');
                document.getElementById('roomPanel').classList.remove('hidden');
                log('连接成功，状态将实时同步', 'text-green-400');
            };
            ws.onmessage = e => {
                const msg = JSON.parse(e.data);
                console.log('[WS 收到]', msg); // 调试
                handleMessage(msg);
            };
            ws.onclose = () => log('连接断开', 'text-red-400');
        }

        function handleMessage(msg) {
            if (msg.type === 'error') {
                log(`❌ ${msg.data.message || msg.data.Message}`, 'text-red-400');
                alert(`操作失败：${msg.data.message || msg.data.Message}`);
                return;
            }
            if (msg.type === 'broadcast') {
                const data = msg.data || {};

                // 处理房间创建或玩家加入事件
                if (data.event === 'room_created' || data.event === 'player_joined') {
                    const content = data.content || {};
                    if (content.room_id) {
                        currentRoomID = content.room_id;
                        document.getElementById('roomInfo').classList.remove('hidden');
                        document.getElementById('currentRoomId').textContent = currentRoomID;
                        document.getElementById('roomTip').textContent = '✅ 房间就绪，可复制分享';
                    }
                    log(`🎉 ${content.message || '房间已创建'}`, 'text-green-400');
                    return;
                }

                // 处理玩家离开事件
                if (data.event === 'player_left') {
                    const content = data.content || {};
                    const leftPlayerId = content.player_id || content.PlayerID;
                    log(`👋 玩家 ${leftPlayerId} 离开了房间`, 'text-yellow-400');
                    // 如果是自己离开，清理房间状态
                    if (leftPlayerId === playerID) {
                        currentRoomID = '';
                        document.getElementById('roomInfo').classList.add('hidden');
                        log('你已离开房间', 'text-gray-400');
                    }
                    return;
                }

                if (data.event === 'chat') {
                    const content = data.content || {};
                    addChat(content.player_id || content.PlayerID, content.content || content.Content);
                    return;
                }

                if (data.event === 'game_started' || data.event === 'state_update') {
                    log('收到最新游戏状态（已同步）', 'text-green-400');
                    updateGameState(data.content);
                    return;
                }

                if (data.event === 'game_over') {
                    const content = data.content || {};
                    log(`🎉 游戏结束！获胜者 ${content.winner || content.Winner}`, 'text-yellow-400');
                    alert(`游戏结束！获胜者：${content.winner || content.Winner}`);
                    return;
                }
            }
        }

        function updateGameState(state) {
            if (!state) return;

            // 兼容不同格式的 state
            const currentTurn = state.current || state.CurrentTurn || '';
            const lastCard = state.last_card !== undefined ? state.last_card : (state.LastCard !== undefined ? state.LastCard : '无');
            const players = state.players || state.Players || [];
            const hands = state.hands || state.Hands || {};

            document.getElementById('currentTurn').textContent = currentTurn || '等待中';
            document.getElementById('currentTurn').classList.toggle('text-green-400', currentTurn === playerID);
            document.getElementById('lastCard').textContent = lastCard;

            const list = document.getElementById('playersList');
            list.innerHTML = '';
            players.forEach(p => {
                list.innerHTML += `<div class="flex justify-between bg-gray-700 px-4 py-2 rounded-lg"><span>${p}${p === playerID ? ' (我)' : ''}</span><span class="${p === currentTurn ? 'text-green-400' : ''}">●</span></div>`;
            });
            document.getElementById('playerCount').textContent = players.length;

            if (hands[playerID] || hands[PlayerID]) {
                myHandCards = hands[playerID] || hands[PlayerID];
                renderMyHand();
            } else {
                // 如果自己没有手牌数据，清空手牌显示
                myHandCards = [];
                document.getElementById('myHand').innerHTML = '';
            }
        }

        function renderMyHand() {
            const c = document.getElementById('myHand');
            c.innerHTML = '';
            myHandCards.forEach(card => {
                const el = document.createElement('div');
                el.className = 'card bg-white text-black w-16 h-24 flex items-center justify-center text-4xl font-bold rounded-2xl cursor-pointer shadow-xl border-2 border-yellow-400';
                el.textContent = card;
                el.onclick = () => playCard(card);
                c.appendChild(el);
            });
        }

        function playCard(card) {
            if (!currentRoomID || !ws) return alert('请先进入房间');
            log(`已发送出牌请求: ${card}，等待服务器响应...`, 'text-blue-400');
            ws.send(JSON.stringify({
                type: "game_action",
                room_id: currentRoomID,
                data: { action: "play_card", card: card }
            }));
        }

        function createRoom() { /* 同上版 */ if (!ws || isCreating) return; isCreating = true; document.getElementById('createBtn').textContent = '创建中...'; ws.send(JSON.stringify({ type: "create_room", data: { game_type: "simple" } })); setTimeout(() => { isCreating = false; document.getElementById('createBtn').textContent = '🆕 创建新房间'; }, 3000); }

        function joinRoom() { /* 同上版 */ if (!ws) return; const roomId = document.getElementById('roomIdInput').value.trim(); if (!roomId) return alert('请输入房间号'); ws.send(JSON.stringify({ type: "join_room", data: { room_id: roomId } })); log(`正在加入房间 ${roomId}...`, 'text-yellow-300'); }

        function sendChat() { /* 同上版 */ const input = document.getElementById('chatInput'); const content = input.value.trim(); if (!content || !currentRoomID || !ws) return; ws.send(JSON.stringify({ type: "chat", room_id: currentRoomID, data: { content } })); input.value = ''; }

        function copyRoomId() { const id = document.getElementById('currentRoomId').textContent; navigator.clipboard.writeText(id).then(() => alert('房间号已复制！')); }

        log('页面就绪，状态同步机制已升级', 'text-yellow-300');
    </script>
</body>

</html>
