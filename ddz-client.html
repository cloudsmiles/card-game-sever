<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡牌游戏 - 斗地主客户端</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card {
            transition: all 0.2s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.3);
        }

        .selected {
            border: 2px solid blue !important;
            transform: translateY(-12px);
        }

        .my-turn {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }
    </style>
</head>

<body class="bg-gray-900 text-white min-h-screen">
    <div class="max-w-6xl mx-auto p-6">
        <h1 class="text-4xl font-bold text-center mb-8">🎴 斗地主实时对战</h1>

        <!-- 连接区 -->
        <div id="connectPanel" class="bg-gray-800 p-6 rounded-xl mb-8">
            <div class="flex gap-4 items-end">
                <div class="flex-1">
                    <label class="block text-sm mb-1">你的昵称</label>
                    <input id="playerName" type="text" value="玩家1"
                        class="w-full bg-gray-700 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button onclick="connect()" class="bg-green-600 hover:bg-green-700 px-8 py-3 rounded-lg font-semibold">
                    连接服务器
                </button>
            </div>
            <div id="status" class="mt-3 text-sm text-gray-400"></div>
        </div>

        <!-- 准备区 -->
        <div id="readyPanel" class="hidden bg-gray-800 p-6 rounded-xl mb-8">
            <div class="flex items-center justify-between">
                <div>
                    <span class="text-sm text-gray-400">房间状态：</span>
                    <span id="roomState" class="font-bold text-lg">等待中</span>
                </div>
                <button id="readyBtn" onclick="toggleReady()"
                    class="bg-yellow-600 hover:bg-yellow-700 px-8 py-3 rounded-xl font-bold">
                    🎯 准备
                </button>
            </div>
            <div id="playerList" class="mt-4 space-y-2"></div>
        </div>

        <!-- 房间操作区 -->
        <div id="roomPanel" class="hidden bg-gray-800 p-6 rounded-xl mb-8">
            <div class="flex gap-6">
                <button onclick="createRoom()" id="createBtn"
                    class="flex-1 bg-blue-600 hover:bg-blue-700 py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2">
                    🆕 创建新房间（斗地主）
                </button>

                <div class="flex-1 flex gap-3">
                    <input id="roomIdInput" placeholder="输入房间号"
                        class="flex-1 bg-gray-700 rounded-xl px-4 focus:outline-none focus:ring-2 focus:ring-purple-500">
                    <button onclick="joinRoom()" class="bg-purple-600 hover:bg-purple-700 px-8 rounded-xl font-bold">
                        加入房间
                    </button>
                </div>
            </div>
            <div id="roomInfo" class="mt-4 text-center text-lg font-semibold hidden">
                当前房间：<span id="currentRoomId" class="text-green-400"></span>
                <button onclick="copyRoomId()" class="ml-4 bg-gray-600 px-4 py-1 rounded-lg text-sm">复制</button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- 游戏区 -->
            <div class="lg:col-span-2 bg-gray-800 rounded-2xl p-6">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <span class="text-sm text-gray-400">当前回合：</span>
                        <span id="currentTurn" class="font-bold text-xl"></span>
                    </div>
                    <div>
                        <span class="text-sm text-gray-400">上家出的牌：</span>
                        <span id="lastCard" class="font-mono text-3xl font-bold text-yellow-400"></span>
                    </div>
                    <div>
                        <span class="text-sm text-gray-400">阶段：</span>
                        <span id="phase" class="font-bold text-xl"></span>
                    </div>
                    <div>
                        <span class="text-sm text-gray-400">地主：</span>
                        <span id="landlord" class="font-bold text-xl"></span>
                    </div>
                </div>

                <!-- 手牌区 -->
                <div class="mb-4">
                    <div class="text-sm text-gray-400 mb-2">你的手牌（点击选择）</div>
                    <div id="myHand" class="flex gap-1 flex-wrap overflow-x-auto"></div>
                </div>

                <!-- 操作区 -->
                <div id="actionArea" class="flex gap-4 mb-4"></div>

                <div id="gameLog" class="bg-black/50 h-48 overflow-y-auto rounded-xl p-4 text-sm font-mono"></div>
            </div>

            <!-- 右侧：玩家列表 + 聊天 -->
            <div class="space-y-6">
                <div class="bg-gray-800 rounded-2xl p-6">
                    <h3 class="font-bold mb-4 flex items-center gap-2">
                        👥 在线玩家 (<span id="playerCount">0</span>)
                    </h3>
                    <div id="playersList" class="space-y-2"></div>
                </div>

                <div class="bg-gray-800 rounded-2xl p-6 flex flex-col h-96">
                    <h3 class="font-bold mb-4">💬 聊天室</h3>
                    <div id="chatMessages" class="flex-1 overflow-y-auto space-y-3 text-sm"></div>

                    <div class="flex gap-2 mt-4">
                        <input id="chatInput" placeholder="输入消息..."
                            class="flex-1 bg-gray-700 rounded-xl px-4 py-3 focus:outline-none"
                            onkeypress="if(event.key==='Enter') sendChat()">
                        <button onclick="sendChat()" class="bg-indigo-600 hover:bg-indigo-700 px-6 rounded-xl">
                            发送
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let playerID = '';
        let currentRoomID = '';
        let selectedCards = [];
        let isCreating = false;
        let onlinePlayers = []; // 在线玩家列表
        let isReady = false; // 当前玩家准备状态
        let roomPlayers = []; // 房间内玩家信息（含座位号和准备状态）

        function log(msg, color = 'text-gray-300') {
            const div = document.getElementById('gameLog');
            div.innerHTML += `<span class="${color}">[${new Date().toLocaleTimeString()}] ${msg}</span><br>`;
            div.scrollTop = div.scrollHeight;
        }

        function addChat(name, content) {
            const div = document.getElementById('chatMessages');
            div.innerHTML += `
        <div class="flex gap-2">
          <span class="text-blue-400 font-medium">${name}：</span>
          <span>${content}</span>
        </div>`;
            div.scrollTop = div.scrollHeight;
        }

        function connect() {
            const name = document.getElementById('playerName').value.trim();
            if (!name) return alert('请输入昵称');

            playerID = name;
            const url = `ws://localhost:8080/ws?player=${encodeURIComponent(name)}`;

            ws = new WebSocket(url);

            ws.onopen = () => {
                document.getElementById('status').innerHTML = '✅ 已连接到服务器';
                document.getElementById('connectPanel').classList.add('hidden');
                document.getElementById('roomPanel').classList.remove('hidden');
                log('WebSocket 连接成功', 'text-green-400');
            };

            // 添加心跳
            setInterval(() => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: "ping" }));
                }
            }, 30000);

            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                console.log('收到原始消息:', e.data);
                handleMessage(msg);
            };

            ws.onclose = () => {
                log('连接已断开', 'text-red-400');
            };
        }

        function handleMessage(msg) {
            // 调试：打印所有接收到的消息
            console.log('收到消息:', JSON.stringify(msg, null, 2));

            // 统一错误处理
            if (msg.type === 'error') {
                const errorMsg = msg.data?.message || msg.data?.Message || msg.data?.error || '未知错误';
                log(`❌ ${errorMsg}`, 'text-red-400');
                return;
            }

            // 广播消息处理
            if (msg.type === 'broadcast') {
                const data = msg.data || {};
                const event = data.event;
                const content = data.content || {};

                console.log('广播事件:', event, '内容:', content);

                switch (event) {
                    case 'room_state_changed':
                        // 统一房间状态变更（包含玩家加入/离开/准备）
                        handleRoomStateChanged(content);
                        break;

                    case 'game_started':
                        log('🎮 游戏开始！', 'text-green-400');
                        document.getElementById('readyPanel').classList.add('hidden');
                        updateGameState(content);
                        break;

                    case 'state_update':
                        updateGameState(content);
                        break;

                    case 'game_over':
                        const winner = content.winner || content.Winner;
                        log(`🏆 游戏结束！获胜者 ${winner}`, 'text-yellow-400');
                        alert(`游戏结束！获胜者：${winner}`);
                        break;

                    case 'chat':
                        addChat(content.player_id || content.PlayerID, content.content || content.Content);
                        break;

                    default:
                        console.log('未处理的广播事件:', event, content);
                }
            }
        }

        // 处理房间状态变更
        function handleRoomStateChanged(content) {
            const roomId = content.room_id || content.RoomID;
            const state = content.state || content.State;
            const players = content.players || content.Players || [];
            const message = content.message || content.Message;

            // 更新房间ID
            if (roomId && !currentRoomID) {
                currentRoomID = roomId;
                document.getElementById('roomInfo').classList.remove('hidden');
                document.getElementById('currentRoomId').textContent = currentRoomID;
                document.getElementById('readyPanel').classList.remove('hidden');
                isCreating = false;
                document.getElementById('createBtn').disabled = false;
            }

            // 更新房间状态显示
            const stateText = {
                'waiting': '等待中',
                'playing': '游戏中'
            }[state] || state;
            document.getElementById('roomState').textContent = stateText;

            // 更新玩家列表
            roomPlayers = players;
            updatePlayerList();

            // 更新准备按钮状态
            const myPlayer = players.find(p => p.player_id === playerID);
            if (myPlayer) {
                isReady = myPlayer.ready;
                updateReadyButton();
            }

            // 游戏开始后隐藏准备面板，游戏结束后显示
            if (state === 'playing') {
                document.getElementById('readyPanel').classList.add('hidden');
            } else if (state === 'waiting') {
                document.getElementById('readyPanel').classList.remove('hidden');
                // 重置游戏相关UI
                document.getElementById('myHand').innerHTML = '';
                document.getElementById('actionArea').innerHTML = '';
                document.getElementById('phase').textContent = '等待中';
                document.getElementById('currentTurn').textContent = '';
                document.getElementById('landlord').textContent = '未定';
                document.getElementById('lastCard').textContent = '无';
                selectedCards = [];
            }

            // 显示消息
            if (message) {
                log(message, 'text-blue-300');
            }
        }

        // 更新玩家列表显示
        function updatePlayerList() {
            const list = document.getElementById('playerList');
            list.innerHTML = '';

            roomPlayers.forEach(p => {
                const isMe = p.player_id === playerID ? ' (我)' : '';
                const readyStatus = p.ready ?
                    '<span class="text-green-400">✓ 已准备</span>' :
                    '<span class="text-gray-400">○ 未准备</span>';

                list.innerHTML += `
                    <div class="flex justify-between bg-gray-700 px-4 py-2 rounded-lg">
                        <span>座位${p.seat_number}: ${p.player_id}${isMe}</span>
                        ${readyStatus}
                    </div>`;
            });

            // 更新在线玩家列表（兼容游戏状态）
            onlinePlayers = roomPlayers.map(p => p.player_id);
            document.getElementById('playerCount').textContent = onlinePlayers.length;
        }

        // 更新准备按钮
        function updateReadyButton() {
            const btn = document.getElementById('readyBtn');
            if (isReady) {
                btn.textContent = '✓ 取消准备';
                btn.classList.remove('bg-yellow-600', 'hover:bg-yellow-700');
                btn.classList.add('bg-green-600', 'hover:bg-green-700');
            } else {
                btn.textContent = '🎯 准备';
                btn.classList.remove('bg-green-600', 'hover:bg-green-700');
                btn.classList.add('bg-yellow-600', 'hover:bg-yellow-700');
            }
        }

        // 切换准备状态
        function toggleReady() {
            if (!ws || !currentRoomID) return;

            ws.send(JSON.stringify({
                type: "room.action",
                room_id: currentRoomID,
                data: {
                    action: "ready",
                    data: { ready: !isReady }
                }
            }));

            log(isReady ? '取消准备...' : '准备中...', 'text-yellow-300');
        }

        // 更新在线玩家列表显示
        function updateOnlinePlayers() {
            const list = document.getElementById('playersList');
            list.innerHTML = '';
            onlinePlayers.forEach(p => {
                const isMe = p === playerID ? ' (我)' : '';
                // 这里暂时不显示地主信息，因为需要从游戏状态获取
                list.innerHTML += `
          <div class="flex justify-between bg-gray-700 px-4 py-2 rounded-lg">
            <span>${p}${isMe}</span>
            <span class="text-gray-400">●</span>
          </div>`;
            });
            document.getElementById('playerCount').textContent = onlinePlayers.length;
        }

        function renderMyHand(hand) {
            const container = document.getElementById('myHand');
            container.innerHTML = '';
            // 注意：这里不清空selectedCards，保持当前选择状态
            hand.sort((a, b) => a - b); // 排序手牌

            // 为每张牌创建唯一标识
            hand.forEach((v, index) => {
                const el = document.createElement('div');
                el.className = `card bg-white text-black w-12 h-20 flex items-center justify-center text-2xl font-bold rounded-lg shadow-xl border-2 border-gray-300`;
                el.textContent = valueToStr(v);
                // 使用值+索引作为唯一标识
                el.dataset.cardId = `${v}_${index}`;
                el.dataset.value = v;
                el.onclick = () => toggleSelect(el, v, index); // 传递索引参数
                container.appendChild(el);
            });

            // 重新应用选中状态（如果有的话）
            selectedCards.forEach(cardInfo => {
                const cardEl = Array.from(container.children).find(el =>
                    el.dataset.cardId === cardInfo.id
                );
                if (cardEl) {
                    cardEl.classList.add('selected');
                }
            });
        }

        function toggleSelect(el, value, index) {
            // 创建唯一的卡片标识
            const cardId = `${value}_${index}`;

            // 查找这个具体卡片是否已被选中
            const selectedIndex = selectedCards.findIndex(card => card.id === cardId);

            console.log('点击卡片:', { value, index, cardId });
            console.log('当前选中列表:', selectedCards);

            if (selectedIndex > -1) {
                // 取消选择这张具体的牌
                selectedCards.splice(selectedIndex, 1);
                el.classList.remove('selected');
                log(`取消选择 ${valueToStr(value)}，剩余 ${selectedCards.length} 张牌`, 'text-gray-400');
            } else {
                // 添加选择这张具体的牌
                selectedCards.push({
                    id: cardId,
                    value: value,
                    index: index
                });
                el.classList.add('selected');
                log(`已选择 ${selectedCards.length} 张牌: ${selectedCards.map(c => valueToStr(c.value)).join(', ')}`, 'text-blue-300');
            }

            console.log('更新后的选中列表:', selectedCards);
        }

        function updateGameState(state) {
            if (!state) return;

            // 兼容不同格式的 state
            const phase = state.phase || state.Phase || '';
            const currentTurn = state.current || state.CurrentTurn || '';
            const landlord = state.landlord || state.Landlord || '';
            const lastPlay = state.last_play || state.LastPlay || null;
            const players = state.players || state.Players || [];
            // 注意：现在 state 是针对当前玩家的，包含 my_hand 而不是 hands

            // 更新在线玩家列表（如果游戏状态中有完整玩家列表）
            if (players.length > 0) {
                onlinePlayers = [...players];
                updateOnlinePlayers();
            }

            document.getElementById('phase').textContent = phase === 'call' ? '叫地主' : (phase === 'play' ? '出牌' : '等待中');
            document.getElementById('currentTurn').textContent = currentTurn || '等待中';
            document.getElementById('currentTurn').classList.toggle('text-green-400', currentTurn === playerID);
            document.getElementById('currentTurn').classList.toggle('my-turn', currentTurn === playerID);
            document.getElementById('landlord').textContent = landlord || '未定';

            if (lastPlay) {
                const cards = lastPlay.Cards || [];
                const type = lastPlay.Type || '';
                const cardsDisplay = cards.length > 0 ? cards.map(c => valueToStr(c.Value || c.value)).join(', ') : '';
                document.getElementById('lastCard').textContent = `${type} (${cardsDisplay})`;
            } else {
                document.getElementById('lastCard').textContent = '无';
            }

            // 更新玩家列表显示地主标识
            const list = document.getElementById('playersList');
            list.innerHTML = '';
            onlinePlayers.forEach(p => {
                const isMe = p === playerID ? ' (我)' : '';
                const isLandlord = p === landlord ? ' (地主)' : '';
                list.innerHTML += `
          <div class="flex justify-between bg-gray-700 px-4 py-2 rounded-lg">
            <span>${p}${isMe}${isLandlord}</span>
            <span class="${p === currentTurn ? 'text-green-400' : 'text-gray-400'}">●</span>
          </div>`;
            });

            // 获取手牌（使用新的 my_hand 字段）
            const myHand = state.my_hand || state.MyHand;
            if (myHand) {
                // 只在手牌真正改变时才重新渲染
                renderMyHand(myHand);
            }

            const actionArea = document.getElementById('actionArea');
            actionArea.innerHTML = '';
            if (currentTurn !== playerID) return;

            if (phase === 'call') {
                actionArea.innerHTML = `
          <button onclick="callLandlord(0)" class="bg-gray-600 hover:bg-gray-500 px-6 py-2 rounded-xl">不叫</button>
          <button onclick="callLandlord(1)" class="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded-xl">叫 1 分</button>
          <button onclick="callLandlord(2)" class="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded-xl">叫 2 分</button>
          <button onclick="callLandlord(3)" class="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded-xl">叫 3 分</button>
          <button onclick="clearSelection()" class="bg-gray-500 hover:bg-gray-400 px-6 py-2 rounded-xl">清空选择</button>`;
            } else if (phase === 'play') {
                actionArea.innerHTML = `
          <button onclick="playSelected()" class="bg-green-600 hover:bg-green-700 px-6 py-2 rounded-xl">出牌</button>
          <button onclick="passTurn()" class="bg-red-600 hover:bg-red-700 px-6 py-2 rounded-xl">不出</button>
          <button onclick="clearSelection()" class="bg-gray-500 hover:bg-gray-400 px-6 py-2 rounded-xl">清空选择</button>`;
            }
        }

        // 重置游戏 UI 状态（用于离开房间时）
        function resetGameUI() {
            document.getElementById('phase').textContent = '等待中';
            document.getElementById('currentTurn').textContent = '';
            document.getElementById('landlord').textContent = '未定';
            document.getElementById('lastCard').textContent = '无';
            document.getElementById('playersList').innerHTML = '';
            document.getElementById('playerCount').textContent = '0';
            document.getElementById('myHand').innerHTML = '';
            document.getElementById('actionArea').innerHTML = '';
            onlinePlayers = []; // 清空在线玩家列表
        }

        let isProcessingAction = false; // 防止重复操作

        function playSelected() {
            if (selectedCards.length === 0) return alert('请选择至少一张牌');
            if (isProcessingAction) return; // 防止重复点击
            isProcessingAction = true;

            // 提取出牌的值
            const cardsToPlay = selectedCards.map(card => card.value);

            ws.send(JSON.stringify({
                type: "game.action",
                room_id: currentRoomID,
                data: { action: "play_cards", card: cardsToPlay.map(v => ({ value: v })) }
            }));

            log(`出牌: ${cardsToPlay.map(valueToStr).join(', ')}`, 'text-blue-400');

            // 清空选择状态
            selectedCards = [];
            document.querySelectorAll('.selected').forEach(el => el.classList.remove('selected'));

            // 300ms后恢复操作
            setTimeout(() => { isProcessingAction = false; }, 300);
        }

        function passTurn() {
            if (isProcessingAction) return;
            isProcessingAction = true;
            ws.send(JSON.stringify({
                type: "game.action",
                room_id: currentRoomID,
                data: { action: "pass" }
            }));
            log('你选择不出', 'text-yellow-400');
            setTimeout(() => { isProcessingAction = false; }, 300);
        }

        function callLandlord(score) {
            if (isProcessingAction) return;
            isProcessingAction = true;
            ws.send(JSON.stringify({
                type: "game.action",
                room_id: currentRoomID,
                data: { action: "call_landlord", card: score }
            }));
            log(`你叫了 ${score} 分`, 'text-blue-400');
            setTimeout(() => { isProcessingAction = false; }, 300);
        }

        function valueToStr(v) {
            if (v >= 3 && v <= 10) return v;
            if (v === 11) return 'J';
            if (v === 12) return 'Q';
            if (v === 13) return 'K';
            if (v === 14) return 'A';
            if (v === 15) return '2';
            if (v === 16) return '小王';
            if (v === 17) return '大王';
            return '?';
        }

        function createRoom() {
            if (!ws || isCreating) return;
            isCreating = true;
            document.getElementById('createBtn').disabled = true;
            ws.send(JSON.stringify({
                type: "room.create",
                data: { game_type: "ddz" }
            }));
            log('正在创建斗地主房间...', 'text-yellow-300');
        }

        function joinRoom() {
            if (!ws) return;
            const roomId = document.getElementById('roomIdInput').value.trim();
            if (!roomId) return alert('请输入房间号');
            ws.send(JSON.stringify({
                type: "room.join",
                data: { room_id: roomId }
            }));
            log(`正在加入房间 ${roomId}...`, 'text-yellow-300');
            document.getElementById('roomIdInput').value = '';
        }

        function sendChat() {
            const input = document.getElementById('chatInput');
            const content = input.value.trim();
            if (!content || !currentRoomID) return;
            ws.send(JSON.stringify({
                type: "chat",
                room_id: currentRoomID,
                data: { content }
            }));
            addChat(playerID, content);
            input.value = '';
        }

        function copyRoomId() {
            navigator.clipboard.writeText(currentRoomID).then(() => alert('房间号已复制！'));
        }

        // 添加清空选择的函数
        function clearSelection() {
            selectedCards = [];
            document.querySelectorAll('.selected').forEach(el => el.classList.remove('selected'));
            log('已清空选择', 'text-gray-400');
        }
